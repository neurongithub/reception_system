<!DOCTYPE html>
<html lang="en" lang="fa" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title dir="rtl">{% block title%}{% endblock  %}</title>
    <link rel="stylesheet" href="{{ url_for('static' ,filename='css/style.css')  }}">

    {% block extra_css %}{% endblock %}
</head>
<body>
    {# web site header #}
    <header>
        
        <nav dir="rtl" class = "navbar">
            <div class="nav-logo">Application LOGO</div>
            <ul class="nav-links">
                {# <li><a href="#">test0</a> </li>
                <li><a href="#">test1</a></li>
                <li><a href="#">test2</a></li> #}
                <p>سامانه یکپارچه پذیرش فراگیران </p>
            </ul>
            <div class='date-time'>Date/time</div>
             

        </nav>
       

    </header>

    {# web site body #}
    <main dir="rtl">
        {% block content %}
        {% endblock  %}
    </main><br><br>


    <footer dir="rtl">
        {% block footer %}
        {% endblock %}
    </footer>
    



    <script src="{{ url_for('static' , filename='js/script.js') }}""></script>
</body>
</html>
